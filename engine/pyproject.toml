[project]
name = "terra-pulse-engine"
version = "0.1.0"
description = "Terra Pulse statistical engine — pre-registered hypothesis testing (Phase 4)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "numpy>=2.1",
  "scipy>=1.14",
  # H6 only. Skyfield reads the JPL DE440 kernel the app downloads at runtime —
  # the *code* is a small pure-Python package and ships in the PyInstaller
  # bundle; the 31.2 MB kernel does not. See packages/schema/src/ephemeris.ts
  # for why that split. `jplephem` and `sgp4` come along as its dependencies.
  "skyfield>=1.49",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "ruff>=0.7",
]
# Kept out of `dev` on purpose: PyInstaller is only needed to cut a release
# bundle, and nothing in the test suite touches it. Anyone who just wants to run
# the engine or its tests should not pay for it.
bundle = [
  "pyinstaller>=6.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["terra_pulse_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: calibration-style tests that run many permutation batches"]

[tool.ruff]
line-length = 100
target-version = "py312"
